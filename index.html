<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Meditations Quantic Geometries">
    <title>Meditations Quantic Geometries</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >

    <style>
      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 20%, rgba(118, 75, 162, 0.4), transparent 35%),
          radial-gradient(circle at 80% 80%, rgba(37, 117, 252, 0.35), transparent 35%),
          #090b1a;
      }

      .hero-card {
        max-width: 760px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(14px);
      }

      .accent {
        color: #bda7ff;
      }
    </style>
  </head>
  <body class="d-flex align-items-center text-light">
    <main class="container py-5">
      <section class="hero-card mx-auto rounded-4 p-4 p-md-5 text-center shadow-lg">
        <p class="accent text-uppercase fw-semibold small mb-3">Bienvenido</p>
        <h1 class="display-3 fw-bold mb-3">Meditations Quantic Geometries</h1>
        <p class="lead text-white-50 mb-0">
          Un espacio para explorar la meditación, la conciencia y la geometría cuántica.
        </p>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
