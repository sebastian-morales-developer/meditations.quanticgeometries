<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Entorno de conversación de Meditations Quantic Geometries">
    <meta name="theme-color" content="#080b16">
    <title>Meditations Chat · Quantic Geometries</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="app-shell d-flex">
      <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="conversationSidebar" aria-labelledby="conversationSidebarLabel">
        <div class="offcanvas-header d-lg-none">
          <h2 class="offcanvas-title fs-6" id="conversationSidebarLabel">Conversaciones</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#conversationSidebar" aria-label="Cerrar"></button>
        </div>

        <div class="sidebar-content d-flex flex-column h-100">
          <div class="brand d-flex align-items-center gap-3">
            <div class="brand-mark" aria-hidden="true"><i class="bi bi-stars"></i></div>
            <div>
              <p class="brand-kicker mb-0">Quantic Geometries</p>
              <h1 class="brand-name mb-0">Meditations</h1>
            </div>
          </div>

          <button class="btn new-chat-button w-100 d-flex align-items-center justify-content-center gap-2" id="newConversationButton" type="button">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
            Nueva conversación
          </button>

          <div class="conversation-heading d-flex align-items-center justify-content-between">
            <span>Conversaciones</span>
            <span class="conversation-count" id="conversationCount">0</span>
          </div>

          <nav class="conversation-list flex-grow-1" id="conversationList" aria-label="Lista de conversaciones"></nav>

          <div class="sidebar-footer d-flex align-items-center gap-3">
            <div class="status-orb"><span></span></div>
            <div>
              <p class="mb-0">Servidor conectado</p>
              <small>Respuestas de demostración</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="chat-panel flex-grow-1 d-flex flex-column">
        <header class="chat-header d-flex align-items-center gap-3">
          <button class="btn mobile-menu d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#conversationSidebar" aria-controls="conversationSidebar" aria-label="Abrir conversaciones">
            <i class="bi bi-layout-sidebar-inset"></i>
          </button>
          <div class="active-avatar" aria-hidden="true"><i class="bi bi-chat-dots"></i></div>
          <div class="chat-heading min-w-0">
            <p class="chat-label mb-1">Conversación activa</p>
            <h2 class="chat-title text-truncate mb-0" id="activeConversationTitle">Nueva conversación</h2>
          </div>
          <div class="mode-picker ms-auto">
            <label class="mode-label" for="conversationTypeSelect">Modo de respuesta</label>
            <select class="form-select mode-select" id="conversationTypeSelect" aria-label="Modo de respuesta" disabled></select>
          </div>
          <div class="online-badge d-none d-xl-flex align-items-center gap-2">
            <span></span> En línea
          </div>
        </header>

        <section class="message-stage flex-grow-1" id="messageStage" aria-live="polite">
          <div class="message-column" id="messageList"></div>
        </section>

        <footer class="composer-area">
          <form class="composer mx-auto" id="messageForm">
            <label class="visually-hidden" for="messageInput">Escribe un mensaje</label>
            <textarea class="form-control" id="messageInput" rows="1" maxlength="2000" placeholder="Escribe un mensaje…" required></textarea>
            <button class="voice-button" id="voiceButton" type="button" aria-label="Iniciar grabación de voz" title="Dictar por voz">
              <i class="bi bi-mic" id="voiceIcon" aria-hidden="true"></i>
            </button>
            <button class="send-button" id="sendButton" type="submit" aria-label="Enviar mensaje">
              <i class="bi bi-arrow-up"></i>
            </button>
          </form>
          <p class="composer-note mb-0" id="composerStatus" aria-live="polite">Enter para enviar · Shift + Enter para una nueva línea</p>
        </footer>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div class="toast error-toast" id="errorToast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-circle"></i>
          <span id="errorMessage">No pudimos completar la acción.</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/text-insertion.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
